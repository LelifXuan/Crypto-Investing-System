[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system-fastapi"
version = "2.3.0"
description = "Local-first FastAPI crypto trading management app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiosqlite>=0.20",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0",
  "PyJWT>=2.8",
  "httpx>=0.27",
  "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/your-name/trading-system-fastapi"
Issues = "https://github.com/your-name/trading-system-fastapi/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "pandas>=2.2",
  "pandas-ta>=0.3.14b0; python_version < '3.14'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "scripts/sync_portable_local.ps1",
    "scripts/dev.ps1",
    "scripts/dev_env.ps1",
    "tools/launcher/Program.cs",
    # 2026-09-16 (T1): ruff scope 收回到真维护代码 — vendor / build / data / cache 不再扫。
    # runtime_python: Python 3.11 嵌入式解释器副本 (DLLs/Lib/Scripts/python.exe)。
    # runtime: 后台 worker runtime 目录 (含 site-packages 风格副本)。
    # data: 市场数据缓存 / 历史 JSON 副本。
    "runtime_python",
    "runtime_python*/**",
    "runtime/**",
    "data/**",
    "**/__pycache__/**",
    "*.pyc",
    "**/.venv/**",
    "**/node_modules/**",
    "**/.pytest_cache/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/services/strategy_signal/*.py" = ["E501"]
"app/services/technical_signal_classifier.py" = ["E501"]
"scripts/batch_add_macro_indicators.py" = ["E501", "B007"]
"scripts/db_maintenance.py" = ["E501"]
"tests/test_analysis_frontend_static.py" = ["E501"]
"tests/test_monitoring_technical_labels.py" = ["E501"]
"tests/test_strategy_trigger_transparency.py" = ["E501"]
"tests/test_technical_signal_classification.py" = ["E501"]
"tests/test_chip_structure.py" = ["E402"]
"tests/test_data_quality_and_decision.py" = ["E402"]
"app/services/translation/service.py" = ["E501"]
"app/services/monitoring_dashboard.py" = ["E501"]
"app/services/indicator_monitoring.py" = ["E501"]
"app/services/macro/provider_registry.py" = ["E501"]
"app/services/macro/providers/gateio_rwa.py" = ["E501"]
"tests/test_frontend_resilience_static.py" = ["E501"]
"tests/test_macro_overview.py" = ["E501"]
"app/core/paths.py" = ["E501"]
"app/main.py" = ["E501"]
# 2026-09-16 (T1): 测试代码长字符串字面量豁免 E501。
# 这些文件长行集中在 page.evaluate("""...""") JS 模板字符串、长 CSS selector
# fixture、长 URL path fixture。Ruff 物理长度限制不区分 raw 字符串, 拆分
# 会破坏 JS 语法或破坏可读性, 故豁免。其余逻辑检查 (F841/B007/B905/B011/B023/E402)
# 已在本轮手工清偿。
"tests/a11y_visual_diff.py" = ["E501"]
